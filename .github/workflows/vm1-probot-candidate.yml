name: VM1 Probot candidate
on:
  push:
    branches:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate five-role controller and renderers
        run: |
          bash -n local/vm/coreos-podman.sh local/vm/coreos-hvf.sh local/vm/store-selection.sh
          bash local/vm/tests/store-selection.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path("local/fatline/qualification")
          selection=json.loads((base/"probot-webhook-ghxd-sources.json").read_text())
          qualification=json.loads((base/"probot-webhook-sources.json").read_text())
          assert selection["schema"] == qualification["schema"] == 1
          assert set(selection["sources"]) == set(qualification["sources"])
          for name, expected in qualification["sources"].items():
              actual=selection["sources"][name]
              assert actual["checkout"] == expected["checkout"]
              assert actual["revision"] == expected["revision"]
              assert actual["repository"] == "xd-dash/" + name
          PY
          for action in local/vm/host-actions/*.sh; do bash -n "$action"; done
          bash -n local/fatline/coreos-services/vm1-check.sh
          bash -n local/fatline/qualification/test-vm1-guest.sh
          bash local/fatline/qualification/test-vm1-guest.sh
          bash -n local/fatline/startup-profile/runtime.sh
          bash -n local/fatline/startup-profile/probot-guest-stage.sh
          bash -n local/fatline/qualification/probot-artifacts.sh
          python3 -m py_compile local/fatline/startup-profile/probot-render.py local/fatline/startup-profile/probot-stage.py local/fatline/coreos-services/probot-credentials.py local/fatline/coreos-services/candidate-output.py local/fatline/coreos-services/probot-plan.py local/fatline/coreos-services/probot-redis-policy.py
          python3 local/fatline/coreos-services/test_candidate_output.py
      - name: Profile and credential tests
        env:
          AGNI_PROBOT_STAGE: ${{ github.workspace }}/local/fatline/startup-profile/probot-stage.py
          AGNI_PROBOT_PROFILE_RENDER_TEST: ${{ github.workspace }}/local/fatline/startup-profile/test_probot_render.py
          AGNI_PROBOT_CREDENTIAL_GENERATOR_TEST: ${{ github.workspace }}/local/fatline/coreos-services/test_probot_credentials.py
          AGNI_PROBOT_PROFILE_RENDERER: ${{ github.workspace }}/local/fatline/startup-profile/probot-render.py
          AGNI_PROBOT_STARTUP_RENDERER: ${{ github.workspace }}/local/fatline/startup-profile/render.py
          AGNI_PROBOT_CREDENTIAL_GENERATOR: ${{ github.workspace }}/local/fatline/coreos-services/probot-credentials.py
          AGNI_PROBOT_REDIS_PLANNER: ${{ github.workspace }}/local/fatline/coreos-services/probot-redis-policy.py
          AGNI_PROBOT_REDIS_BASELINE: ${{ github.workspace }}/local/fatline/acl-policy.json
          AGNI_PROBOT_REDIS_RENDERER: ${{ github.workspace }}/local/fatline/scripts/render-users-acl.py
        run: |
          python3 local/fatline/startup-profile/test_probot_render.py
          python3 local/fatline/coreos-services/test_probot_credentials.py
          python3 local/fatline/startup-profile/test_probot_stage.py
