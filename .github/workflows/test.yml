name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check new Go surface formatting
        run: gofmt -l main.go nativeexec | tee /dev/stderr | test -z "$(cat)"
      - name: Shoal binding contract (offline)
        run: python3 local/shoal/test_binding.py
      - name: Vet
        run: go vet . ./nativeexec/... ./cmd/...
      - name: Build
        run: go build . ./nativeexec/... ./cmd/...
      - name: Test
        run: go test . ./nativeexec/... ./cmd/...
