name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate dependency sums
        run: go mod download && cat go.sum
      - name: Check new Go surface formatting
        run: gofmt -l main.go nativeexec | tee /dev/stderr | test -z "$(cat)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
