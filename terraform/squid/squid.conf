# Canonical Squid policy for a Debian proxy serving Terraform-created FCOS clients.
# Bind only to the proxy VM's internal address.
http_port 10.138.0.9:3128

# Authorize the CoreOS client subnet instead of one ephemeral VM address.
# Keep the GCE firewall on tcp/3128 restricted to source tag squid-client.
acl coreos_clients src 10.138.0.0/20
acl localhost src 127.0.0.1/32

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow localhost
http_access allow coreos_clients

http_access deny all

access_log stdio:/var/log/squid/access.log
